<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}BU Tier List{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <h1 class="nav-title">Binghamton Tier Lists</h1>
            {% if request.endpoint != 'index' %}
            <div class="nav-left-buttons">
                <a href="{{ url_for('index') }}" class="nav-btn secondary">Back</a>
            </div>
            {% endif %}
        </div>

        <div class="nav-right">
            {% if session.get('username') %}
                <span class="nav-user">Logged in as: {{ session['username'] }}</span>
                <a href="{{ url_for('logout') }}" class="nav-btn">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}" class="nav-btn">Login</a>
                <a href="{{ url_for('signup') }}" class="nav-btn signup">Sign Up</a>
            {% endif %}
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/tierlist.js') }}"></script>
</body>
</html>
