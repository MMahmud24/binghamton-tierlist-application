<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}BU Tier List{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="nav-left">
            <a href="{{ url_for('index') }}" class="nav-brand">
                <img src="{{ url_for('static', filename='images/bu-logo.png') }}" alt="Binghamton University" class="nav-logo-img">
            </a>
            {% if request.endpoint != 'index' %}
            <div class="nav-left-buttons">
                <a href="{{ url_for('index') }}" class="nav-btn secondary">Back</a>
            </div>
            {% endif %}
        </div>

        <div class="nav-right">
            {% if session.get('username') %}
                <div class="nav-user-chip">
                    <div class="nav-avatar">{{ session['username'][0].upper() }}</div>
                    <span class="nav-username">{{ session['username'] }}</span>
                </div>
                <a href="{{ url_for('logout') }}" class="nav-btn nav-btn-outline">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}" class="nav-btn nav-btn-outline">Login</a>
                <a href="{{ url_for('signup') }}" class="nav-btn nav-btn-fill">Sign Up</a>
            {% endif %}
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/tierlist.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
