{% extends "base.html" %}
{% block content %}
 <div class = "wrapper">
     <form id="signup-form" action ="/signup" method="post">
     <h1> Create Account</h1>

    {% if error %}
    <div id="error-msg" style="color:#c00; font-weight:600; margin-bottom:12px;">{{ error }}</div>
    {% else %}
    <div id="error-msg" style="color:#c00; font-weight:600; margin-bottom:12px; display:none;"></div>
    {% endif %}

    {% if success %}
    <div id="success-msg" style="color:#0a7; font-weight:600; margin-bottom:12px;">Account created successfully{% if username %}, {{ username }}{% endif %}.</div>
    {% else %}
    <div id="success-msg" style="color:#0a7; font-weight:600; margin-bottom:12px; display:none;"></div>
    {% endif %}
        <div class="input-box">
            <input type="email" name="email" placeholder = "Email" required>
        </div>
        <div class="input-box">
            <input type="text" name="username" placeholder ="Username" required>
        </div>
        <div class="input-box">
            <input type="password" name="password" placeholder ="Password" required>
        </div> 
                <div class="input-box">
                        <input type="password" id="password2" name="password2" placeholder ="Type Password Again" required>
                </div> 
                 <button type = "submit" class = "btn"> Create </button>
    </form>
    </div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('signup-form');
    const pw1 = form.querySelector('input[name="password"]');
    const pw2 = document.getElementById('password2');
    const err = document.getElementById('error-msg');

    // Reveal any server-side error or success text rendered into the page
    const successDiv = document.getElementById('success-msg');
    if (err && err.textContent && err.textContent.trim() !== '') {
        err.style.display = 'block';
    }
    if (successDiv && successDiv.textContent && successDiv.textContent.trim() !== '') {
        successDiv.style.display = 'block';
    }
    {% if success and redirect_url %}
    const _redirectUrl = {{ redirect_url|tojson }};
    if (_redirectUrl) {
        setTimeout(function() { window.location.href = _redirectUrl; }, 2500);
    }
    {% endif %}

    form.addEventListener('submit', function (e) {
        // client-side check for matching passwords
        if (pw1 && pw2 && pw1.value !== pw2.value) {
            e.preventDefault();
            err.textContent = 'Passwords do not match.';
            err.style.display = 'block';
            pw2.focus();
        }
    });
});
</script>
{% endblock %}
